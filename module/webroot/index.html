<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EFS Carrier Profile</title>
<script src="i18n.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7079;
    --line: #e2e4e8;
    --accent: #2f6fe4;
    --accent-text: #ffffff;
    --warn-bg: #fff4e0;
    --warn-text: #8a5300;
    --ok: #1d8a4c;
    --err: #c62f2f;
    --log-bg: #15171b;
    --log-text: #d5d9e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --card: #1a1c20;
      --text: #e8eaee;
      --muted: #9298a3;
      --line: #2b2e34;
      --accent: #5b8ff0;
      --accent-text: #0d1117;
      --warn-bg: #3a2c12;
      --warn-text: #f3c77a;
      --ok: #4cc283;
      --err: #f07070;
      --log-bg: #0b0c0e;
      --log-text: #c9cdd4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { word-break: break-all; }
  .note { background: var(--card); border: 1px solid var(--accent); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  body.locked [data-lock] { opacity: .45; pointer-events: none; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .sim { margin-bottom: 12px; }
  .sim:last-child { margin-bottom: 0; }
  .sim-label { font-weight: 600; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 10px 0; font: inherit; font-size: 14px;
  }
  .seg button:last-child { border-right: 0; }
  .seg.seg3 { grid-template-columns: repeat(3, 1fr); }
  .seg.seg2 { grid-template-columns: repeat(2, 1fr); }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; overflow-wrap: anywhere; }
  details.diff { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  details.diff summary { cursor: pointer; }
  .diff-list {
    margin-top: 6px; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all;
  }
  .card.testmode { border-color: var(--warn-text); background: var(--warn-bg); color: var(--warn-text); }
  .card.testmode h2 { color: var(--warn-text); }
  .card.testmode .kv span:nth-child(odd), .card.testmode .hint { color: var(--warn-text); opacity: 0.8; }
  .test-ua { margin-top: 10px; }
  .test-ua-label { font-size: 13px; font-weight: 600; }
  .card.testmode .ua { background: var(--card); color: var(--text); }
  #ua-test-carrier .hint { margin: 0 0 10px; }
  .testmode-msg { white-space: pre-line; margin: 0 0 10px; font-weight: 600; word-break: break-all; }
  .sim-label .path { color: var(--muted); font-weight: 400; font-size: 11px; font-family: ui-monospace, monospace; margin-left: 6px; word-break: break-all; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  label.field { display: grid; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  input[type="text"] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; width: 100%;
  }
  .ua { font-family: ui-monospace, monospace; font-size: 12px; background: var(--bg); border-radius: 8px; padding: 8px 10px; word-break: break-all; margin-top: 6px; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; }
  .check input { margin-top: 3px; width: 18px; height: 18px; }
  .check small { display: block; color: var(--muted); font-size: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .wide { grid-column: 1 / -1; }
  button.btn {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.btn:disabled { opacity: 0.5; }
  .status { font-size: 14px; font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  pre.log {
    background: var(--log-bg); color: var(--log-text); border-radius: 8px; padding: 10px; margin: 8px 0 0;
    font-size: 11px; line-height: 1.45; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  select.lang {
    font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; flex: none;
  }
  .check input:disabled + span { opacity: .5; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 data-i18n="title">EFS 통신사 프로필</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <select class="lang" id="lang" aria-label="Language"></select>
  </div>

  <div id="noksu" class="warn" hidden data-i18n="noksu"></div>
  <div id="loading" class="warn" hidden data-i18n="loading"></div>
  <div id="loadfail" class="warn" hidden><span data-i18n="loadfail"></span>
    <button class="btn" id="reload" type="button" style="margin-top:8px" data-i18n="reload"></button></div>
  <div id="applink" class="note" hidden data-i18n="applink"></div>
  <div id="integrated" class="warn" hidden><span data-i18n="integrated"></span><br><span data-i18n="integrated.warn"></span></div>
  <div id="efstrigger" class="warn" hidden data-i18n="efstrigger"></div>

  <section class="card">
    <h2 data-i18n="h.device"></h2>
    <div class="kv">
      <span data-i18n="k.model"></span><span id="model">-</span>
      <span data-i18n="k.build"></span><span id="build">-</span>
      <span data-i18n="k.platform"></span><span id="platform">-</span>
      <span data-i18n="k.efsversion"></span><span id="efsversion">-</span>
      <span data-i18n="k.efssource"></span><span id="efssource">-</span>
      <span data-i18n="k.simdetect"></span><span id="simdetect">-</span>
      <span data-i18n="k.partbackup"></span><span id="partbackup">-</span>
      <span data-i18n="k.lastresult"></span><span id="lastresult">-</span>
    </div>
    <div class="actions" style="margin-top:10px">
      <button class="btn" id="export" type="button" data-i18n="b.export"></button>
    </div>
    <p class="hint" id="export-hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="h.pack"></h2>
    <div class="sim">
      <div class="sim-label" data-i18n="pack.channel"></div>
      <div class="seg seg2" id="pack-channel" data-lock></div>
    </div>
    <div class="kv">
      <span data-i18n="k.current"></span><span id="pack-current">-</span>
      <span data-i18n="k.remote"></span><span id="pack-remote"></span>
    </div>
    <div class="actions" style="margin-top:10px">
      <button class="btn wide" id="pack-check" type="button" data-i18n="b.packcheck"></button>
      <button class="btn primary wide" id="pack-update" type="button" data-lock hidden data-i18n="b.packupdate"></button>
      <button class="btn wide" id="pack-remove" type="button" data-lock hidden data-i18n="b.packremove"></button>
    </div>
    <p class="hint" id="pack-hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="h.status"></h2>
    <div class="kv">
      <span>SIM1 EFS</span><span id="st-slot1">-</span>
      <span>SIM2 EFS</span><span id="st-slot2">-</span>
      <span data-i18n="k.applied"></span><span id="st-applied">-</span>
      <span data-i18n="k.ua"></span><span id="st-ua">-</span>
      <span data-i18n="k.mcfg"></span><span id="st-mcfg">-</span>
      <span>SIM1 IMS</span><span id="st-ims1">-</span>
      <span>SIM2 IMS</span><span id="st-ims2">-</span>
    </div>
    <div class="actions" style="margin-top:10px">
      <button class="btn" id="check" type="button" data-i18n="b.check"></button>
    </div>
    <p class="hint" id="check-hint"></p>
    <details class="diff" id="check-diff" hidden>
      <summary></summary>
      <div class="diff-list" id="check-diff-list"></div>
    </details>
  </section>

  <section class="card testmode" id="testmode-card" hidden>
    <h2>TEST MODE</h2>
    <p class="testmode-msg" data-i18n="testmode.msg"></p>
    <div class="kv">
      <span data-i18n="k.testsim1"></span><span id="test-sim1">-</span>
      <span data-i18n="k.testsim2"></span><span id="test-sim2">-</span>
    </div>
    <div class="test-ua" id="test-ua1" hidden>
      <div class="test-ua-label" data-i18n="test.ua1"></div>
      <div class="ua" id="test-ua1-text"></div>
    </div>
    <div class="test-ua" id="test-ua2" hidden>
      <div class="test-ua-label" data-i18n="test.ua2"></div>
      <div class="ua" id="test-ua2-text"></div>
    </div>
    <p class="hint" data-i18n="test.hint"></p>
  </section>

  <section class="card" id="carrier-card" data-lock>
    <h2 data-i18n="h.carrier"></h2>
    <div class="sim">
      <div class="sim-label">SIM 1</div>
      <div class="seg" data-sim="1"></div>
    </div>
    <div class="sim">
      <div class="sim-label">SIM 2</div>
      <div class="seg" data-sim="2"></div>
    </div>
  </section>

  <section class="card" id="ua-card" data-lock>
    <h2>ims_user_agent</h2>
    <label class="check">
      <input type="checkbox" id="opt-ua" checked>
      <span><span data-i18n="opt.ua"></span><small data-i18n="opt.ua.d"></small></span>
    </label>
    <div id="ua-test-carrier" hidden>
      <p class="hint" data-i18n="ua.testhint"></p>
      <div class="sim" id="ua-carrier1">
        <div class="sim-label" data-i18n="ua.carrier1"></div>
        <div class="seg" data-sim="1"></div>
      </div>
      <div class="sim" id="ua-carrier2">
        <div class="sim-label" data-i18n="ua.carrier2"></div>
        <div class="seg" data-sim="2"></div>
      </div>
    </div>
    <label class="field"><span data-i18n="f.name"></span>
      <input type="text" id="name" maxlength="64" autocomplete="off">
    </label>
    <div id="ua1" class="ua" hidden></div>
    <div id="ua2" class="ua" hidden></div>
  </section>

  <section class="card" data-lock>
    <h2 data-i18n="h.mcfg"></h2>
    <div class="sim">
      <div class="sim-label">SIM 1 <small class="path">mcfg_autoselect_by_uim</small></div>
      <div class="seg seg3" data-mcfg="1"></div>
    </div>
    <div class="sim">
      <div class="sim-label">SIM 2 <small class="path">mcfg_autoselect_by_uim_Subscription01</small></div>
      <div class="seg seg3" data-mcfg="2"></div>
    </div>
    <p class="hint" data-i18n="mcfg.hint"></p>
  </section>

  <section class="card" data-lock>
    <h2 data-i18n="h.options"></h2>
    <label class="check">
      <input type="checkbox" id="opt-volte" checked>
      <span><span data-i18n="opt.volte"></span><small>persist.dbg.ims/volte/vt/wfc_avail_ovr = 1</small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="opt-nv">
      <span><span data-i18n="opt.nv"></span><small data-i18n="opt.nv.d"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="opt-gband">
      <span><span data-i18n="opt.gband"></span><small data-i18n="opt.gband.d"></small><small id="gband-na" class="hint" hidden data-i18n="opt.gband.na"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="opt-auto">
      <span><span data-i18n="opt.auto"></span><small data-i18n="opt.auto.d"></small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="opt-autosim">
      <span><span data-i18n="opt.autosim"></span><small data-i18n="opt.autosim.d"></small></span>
    </label>
    <p class="hint" id="auto-status"></p>
  </section>

  <section class="card">
    <div class="actions">
      <button class="btn primary wide" id="apply" data-lock data-i18n="b.apply"></button>
      <button class="btn" id="probe" data-i18n="b.probe"></button>
      <button class="btn" id="restore" data-lock data-i18n="b.restore"></button>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="h.progress"></h2>
    <div id="status" class="status" data-i18n="st.idle"></div>
    <pre class="log" id="log"></pre>
  </section>
</main>

<script>
  const CTL = "sh /data/adb/modules/efsprofile_kr/efsctl.sh";
  const CARRIER_CODES = ["NONE", "SKT", "KT", "LGU"];
  const MCFG_CODES = ["keep", "lock", "unlock"];
  const carrierLabel = (c) => (c === "NONE" ? t("carrier.NONE") : c === "LGU" ? "LG U+" : c);
  const mcfgLabel = (m) => t("mcfg." + m);
  const state = {
    sim1: "NONE", sim2: "NONE", mcfg1: "keep", mcfg2: "keep",
    testMode: false, needUa: { 1: false, 2: false },
    defaultName: "", build: "", busy: false,
  };
  let cbSeq = 0;
  let pollTimer = null;
  let lastInfo = null;
  let lastLog = "";

  // The manager's exec bridge sometimes never calls back. With timeoutMs the
  // promise resolves with errno -2 instead of hanging; a late callback is ignored.
  function exec(cmd, timeoutMs) {
    return new Promise((resolve) => {
      if (typeof ksu === "undefined") {
        resolve({ errno: -1, stdout: "", stderr: "ksu unavailable" });
        return;
      }
      const name = "__efs_cb" + Date.now().toString(36) + "_" + cbSeq++;
      let timer = null;
      window[name] = (errno, stdout, stderr) => {
        if (timer) clearTimeout(timer);
        window[name] = () => {};
        resolve({ errno, stdout: stdout || "", stderr: stderr || "" });
      };
      if (timeoutMs) timer = setTimeout(() => {
        window[name] = () => {};
        resolve({ errno: -2, stdout: "", stderr: "timeout" });
      }, timeoutMs);
      try {
        ksu.exec(cmd, "{}", name);
      } catch (e) {
        if (timer) clearTimeout(timer);
        resolve({ errno: -3, stdout: "", stderr: String(e) });
      }
    });
  }

  function toast(msg) {
    if (typeof ksu !== "undefined" && ksu.toast) ksu.toast(msg);
  }

  function q(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

  function parseKv(text) {
    const out = {};
    for (const line of text.split("\n")) {
      const i = line.indexOf("=");
      if (i > 0) out[line.slice(0, i)] = line.slice(i + 1);
    }
    return out;
  }

  function segButtons(seg, codes, label, current, onPick) {
    seg.innerHTML = "";
    for (const code of codes) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label(code);
      b.setAttribute("aria-pressed", String(current === code));
      b.onclick = () => onPick(code);
      seg.appendChild(b);
    }
  }

  function renderMcfg() {
    document.querySelectorAll(".seg[data-mcfg]").forEach((seg) => {
      const key = "mcfg" + seg.dataset.mcfg;
      segButtons(seg, MCFG_CODES, mcfgLabel, state[key], (code) => { state[key] = code; renderMcfg(); });
    });
  }

  function renderSeg() {
    document.querySelectorAll(".seg[data-sim]").forEach((seg) => {
      const key = "sim" + seg.dataset.sim;
      segButtons(seg, CARRIER_CODES, carrierLabel, state[key], (code) => { state[key] = code; renderSeg(); renderUa(); });
    });
  }

  let packChannel = "stable";

  function renderChannel() {
    segButtons(document.getElementById("pack-channel"), ["stable", "lab"], (c) => t("ch." + c), packChannel, setChannel);
    renderPackHint();
  }

  // Saved right away (it is not part of the carrier config); then checks the
  // new channel, since that is why the user switched.
  async function setChannel(code) {
    if (code === packChannel || !initDone) return;
    const r = await exec(CTL + " pack-channel " + code, 10000);
    if (!r.stdout.includes("PACK_CHANNEL=" + code)) { toast(t("t.channelFail")); return; }
    packChannel = code;
    renderChannel();
    toast(t(code === "lab" ? "t.channelLab" : "t.channelStable"));
    document.getElementById("pack-check").click();
  }

  function deviceName() {
    return document.getElementById("name").value.trim() || state.defaultName;
  }

  // In test mode a UA is generated only for slots whose inject folder has none.
  function uaSlotActive(sim) {
    return !state.testMode || state.needUa[sim];
  }

  function renderUa() {
    const on = document.getElementById("opt-ua").checked;
    for (const sim of ["1", "2"]) {
      const el = document.getElementById("ua" + sim);
      const carrier = state["sim" + sim];
      el.hidden = !on || carrier === "NONE" || !uaSlotActive(sim);
      el.textContent = `SIM${sim}: TTA-VoLTE/3.0 ${deviceName()}/${state.build} Device_Type/Android_Phone ${carrier}`;
    }
  }

  function setBusy(busy) {
    state.busy = busy;
    for (const id of ["apply", "probe", "restore"]) document.getElementById(id).disabled = busy;
  }

  function showResult(log) {
    const el = document.getElementById("status");
    const m = log.match(/RESULT=(\S+)/g);
    const last = m ? m[m.length - 1].slice(7) : "";
    const exit = (log.match(/=== exit (\d+)/) || [])[1];
    el.className = "status";
    if (state.busy) {
      el.textContent = t("st.running");
    } else if (last.startsWith("OK") || last === "RESTORED") {
      el.className = "status ok";
      el.textContent = t("st.done", last);
    } else if (last || (exit && exit !== "0")) {
      el.className = "status err";
      el.textContent = t("st.failed", last || "exit " + exit);
    } else {
      el.textContent = t("st.idle");
    }
  }

  async function poll() {
    const r = await exec(CTL + " status");
    const [head, ...rest] = r.stdout.split("\n---\n");
    const busy = parseKv(head).BUSY === "1";
    const log = rest.join("\n---\n");
    lastLog = log;
    const pre = document.getElementById("log");
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    pre.textContent = log;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
    setBusy(busy);
    showResult(log);
    if (!busy && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
      loadInfo();
    }
  }

  function startPolling() {
    if (!pollTimer) pollTimer = setInterval(poll, 1000);
    poll();
  }

  const flag = (id) => (document.getElementById(id).checked ? "1" : "0");

  async function saveConfig() {
    // Saving before the stored config is loaded would overwrite it with defaults.
    if (!initDone) { toast(t("t.needInfo")); return false; }
    const name = document.getElementById("name").value.trim();
    const cmd = [CTL, "save", state.sim1, state.sim2, q(name), flag("opt-ua"), flag("opt-nv"), flag("opt-volte"),
      state.mcfg1, state.mcfg2, flag("opt-auto"), flag("opt-autosim"), flag("opt-gband")].join(" ");
    const r = await exec(cmd);
    if (!r.stdout.includes("SAVED")) {
      toast(r.stdout.trim() || t("t.saveFail"));
      return false;
    }
    return true;
  }

  async function start(action) {
    const r = await exec(CTL + " start " + action);
    if (!r.stdout.includes("STARTED")) {
      toast(r.stdout.includes("BUSY") ? t("t.busy") : t("t.startFail"));
      return;
    }
    setBusy(true);
    startPolling();
  }

  document.getElementById("apply").onclick = async () => {
    // Re-read the flag file so the dialog matches what efsctl will do.
    if (!initDone) { toast(t("t.needInfo")); init(); return; }
    const info = await loadInfo();
    if (!info) { toast(t("t.infoFail")); return; }
    const keep = state.mcfg1 === "keep" && state.mcfg2 === "keep";
    let summary;
    if (state.testMode) {
      const has1 = info.TEST_SIM1 === "1", has2 = info.TEST_SIM2 === "1";
      if (!has1 && !has2 && keep) {
        toast(t("t.noInject"));
        return;
      }
      const uaOn = document.getElementById("opt-ua").checked;
      const slot = (sim, has) => {
        if (!has) return t("sum.noFolder");
        if (info["TEST_UA" + sim] === "1") return t("sum.folderUaFile");
        if (uaOn && state["sim" + sim] !== "NONE") return t("sum.folderUaGen", state["sim" + sim]);
        return t("sum.folderNoUa");
      };
      summary = `${t("sum.test")}\nSIM1: ${slot("1", has1)} (MBN ${mcfgLabel(state.mcfg1)})\nSIM2: ${slot("2", has2)} (MBN ${mcfgLabel(state.mcfg2)})`;
    } else {
      const gband = document.getElementById("opt-gband").checked;
      if (state.sim1 === "NONE" && state.sim2 === "NONE" && keep && !gband) {
        toast(t("t.nothing"));
        return;
      }
      summary = `SIM1: ${carrierLabel(state.sim1)} (MBN ${mcfgLabel(state.mcfg1)})\nSIM2: ${carrierLabel(state.sim2)} (MBN ${mcfgLabel(state.mcfg2)})`;
      if (gband) summary += "\n" + t("sum.gband");
    }
    if (!confirm(t("confirm.apply", summary))) return;
    if (await saveConfig()) start("apply");
  };
  document.getElementById("probe").onclick = () => start("probe");
  document.getElementById("restore").onclick = () => {
    if (confirm(t("confirm.restore"))) start("restore");
  };
  document.getElementById("name").oninput = renderUa;
  document.getElementById("opt-ua").onchange = renderUa;
  // The boot check reads the stored config, so save this switch right away.
  document.getElementById("opt-auto").onchange = async (e) => {
    if (await saveConfig()) toast(t(e.target.checked ? "t.autoOn" : "t.autoOff"));
    else e.target.checked = !e.target.checked;
  };
  document.getElementById("opt-autosim").onchange = async (e) => {
    if (!(await saveConfig())) {
      e.target.checked = !e.target.checked;
      return;
    }
    if (e.target.checked) {
      // Start the SIM swap watcher now instead of waiting for the next boot.
      await exec(CTL + " simwatch-start");
      toast(t("t.autosimOn"));
    } else {
      await exec(CTL + " simwatch-stop");
      toast(t("t.autosimOff"));
    }
    setTimeout(loadInfo, 1500);
  };

  // info takes ~0.15 s on the device; retry when the bridge drops the callback.
  async function fetchInfo() {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await exec(CTL + " info", 6000);
      const info = parseKv(r.stdout);
      if (info.MODEL !== undefined) return info;
      await new Promise((ok) => setTimeout(ok, 500));
    }
    return null;
  }

  async function loadInfo() {
    const info = await fetchInfo();
    if (!info) return null;
    lastInfo = info;
    renderInfo(info);
    return info;
  }

  function renderInfo(info) {
    document.getElementById("model").textContent = info.MODEL || "-";
    document.getElementById("build").textContent = info.BUILD || "-";
    document.getElementById("platform").textContent = info.PLATFORM || "-";
    document.getElementById("efssource").textContent = info.EFS_SOURCE || "-";
    document.getElementById("simdetect").textContent = ["1", "2"].map((s) => {
      const [carrier, plmn, simState, alpha] = (info["SIM_DETECT" + s] || "").split("|");
      if (carrier) return "SIM" + s + " " + carrierLabel(carrier) + " (" + plmn + ")";
      if (simState === "LOADED") return "SIM" + s + " " + (alpha || "?") + " (" + (plmn || "-") + ", " + t("sim.notTarget") + ")";
      return "SIM" + s + " " + (simState || t("v.none"));
    }).join(" · ") + (info.SIMWATCH === "1" ? " · " + t("sim.watching") : "");
    document.getElementById("partbackup").textContent = (info.PARTITION_BACKUP || "").trim() || t("v.none");
    document.getElementById("lastresult").textContent = info.LAST_RESULT || "-";
    document.getElementById("efstrigger").hidden = info.EFSTRIGGER !== "1";
    // Companion app: linked = installed; integrated = settings belong to the app.
    const integrated = info.INTEGRATED === "1";
    document.body.classList.toggle("locked", integrated);
    document.getElementById("integrated").hidden = !integrated;
    document.getElementById("applink").hidden = integrated || info.APP_LINKED !== "1";
    // Global band set: needs the file in the profiles in use (or the module).
    const gbandOk = info.GBAND_AVAILABLE !== "0";
    const gband = document.getElementById("opt-gband");
    gband.disabled = !gbandOk;
    if (!gbandOk) gband.checked = false;
    document.getElementById("gband-na").hidden = gbandOk;
    state.testMode = info.TESTMODE === "1";
    document.getElementById("testmode-card").hidden = !state.testMode;
    document.getElementById("carrier-card").hidden = state.testMode;
    const folder = (v) => t(v === "1" ? "test.folderYes" : "test.folderNo");
    for (const sim of ["1", "2"]) {
      const hasFolder = info["TEST_SIM" + sim] === "1";
      const hasUa = hasFolder && info["TEST_UA" + sim] === "1";
      state.needUa[sim] = hasFolder && !hasUa;
      document.getElementById("test-sim" + sim).textContent = folder(info["TEST_SIM" + sim]);
      document.getElementById("test-ua" + sim).hidden = !hasUa;
      document.getElementById("test-ua" + sim + "-text").textContent = info["TEST_UA" + sim + "_TEXT"] || t("test.emptyFile");
      document.getElementById("ua-carrier" + sim).hidden = !state.needUa[sim];
    }
    document.getElementById("ua-card").hidden = state.testMode && !state.needUa["1"] && !state.needUa["2"];
    document.getElementById("ua-test-carrier").hidden = !state.testMode;
    document.getElementById("export-hint").textContent = info.EXPORT_AT ? t("export.last", info.EXPORT_AT) : t("export.hint");
    renderAuto(info);
    renderCheck(info);
    renderPack(info);
    renderUa();
  }

  const isLab = (tag) => /-LAB$/.test(tag || "");

  function packLabel(version, tag) {
    return (version || t("v.unknown")) + (tag ? " (" + tag + ")" : "") + (isLab(tag) ? " · " + t("pack.lab") : "");
  }

  let packRepo = "";

  function renderPack(info) {
    const fromPack = info.EFS_FROM === "pack";
    document.getElementById("efsversion").textContent =
      (info.EFS_VERSION || t("v.unknown")) + (fromPack ? " · GitHub " + (info.EFS_TAG || "") : " · " + t("pack.bundled"));
    document.getElementById("pack-current").textContent =
      packLabel(info.EFS_VERSION, info.EFS_TAG) + " · " + t(fromPack ? "pack.fromPack" : "pack.bundled");
    document.getElementById("pack-remove").hidden = !fromPack;
    packChannel = info.PACK_CHANNEL === "lab" ? "lab" : "stable";
    packRepo = info.PACK_REPO || "";
    renderChannel();
  }

  function renderPackHint() {
    document.getElementById("pack-hint").textContent =
      t(packChannel === "lab" ? "pack.hintLab" : "pack.hintStable") + " " + t("pack.hintTail", packRepo);
  }

  let remoteTag = "";

  document.getElementById("pack-check").onclick = async (e) => {
    e.target.disabled = true;
    const remote = document.getElementById("pack-remote");
    remote.textContent = t("pack.checking");
    document.getElementById("pack-update").hidden = true;
    const r = await exec(CTL + " pack-check", 45000);
    e.target.disabled = false;
    const p = parseKv(r.stdout);
    if (p.PACK_CHECK !== "OK") {
      remote.textContent = t(r.errno === -2 ? "pack.noResponse" : "pack.checkFail");
      return;
    }
    remoteTag = p.REMOTE_TAG;
    let text = packLabel(p.REMOTE_VERSION, p.REMOTE_TAG) + (p.REMOTE_DATE ? " · " + p.REMOTE_DATE : "");
    // Lab channel without a -LAB release newer than stable: say so, and offer
    // the stable release instead.
    if (p.LAB_NONE === "1") text = t("pack.labNone") + " " + text;
    if (p.PACK_SWITCH === "1") text += " · " + t("pack.canSwitch");
    else if (p.PACK_UPDATE === "1") text += " · " + t("pack.canUpdate");
    else if (p.PACK_OLDER === "1") text += " · " + t("pack.older");
    else text += " · " + t("pack.latest");
    remote.textContent = text;
    const btn = document.getElementById("pack-update");
    btn.hidden = p.PACK_UPDATE !== "1";
    btn.textContent = t("pack.download", packLabel(p.REMOTE_VERSION, p.REMOTE_TAG));
  };

  document.getElementById("pack-update").onclick = async (e) => {
    if (!remoteTag) return;
    if (state.busy) { toast(t("t.otherBusy")); return; }
    if (!confirm(t("confirm.pack", remoteTag))) return;
    e.target.disabled = true;
    document.getElementById("pack-remote").textContent = t("pack.downloading");
    const r = await exec(CTL + " pack-update " + q(remoteTag), 180000);
    e.target.disabled = false;
    document.getElementById("log").textContent = r.stdout;
    const m = r.stdout.match(/PACK_RESULT=OK (\S+) (\S+)/);
    if (m) {
      toast(t("t.packOk", m[1], m[2]));
      e.target.hidden = true;
      document.getElementById("pack-remote").textContent = packLabel(m[2], m[1]) + " · " + t("pack.got");
    } else {
      toast(t(r.errno === -2 ? "t.noResponseRetry" : "t.packFail"));
      document.getElementById("pack-remote").textContent = t("pack.failed");
    }
    await loadInfo();
  };

  document.getElementById("pack-remove").onclick = async () => {
    if (!confirm(t("confirm.packRemove"))) return;
    const r = await exec(CTL + " pack-remove", 15000);
    toast(t(r.stdout.includes("REMOVED") ? "t.packRemoved" : "t.packRemoveFail"));
    await loadInfo();
  };

  function slotText(c, m, n) {
    if (!c) return t("slot.unknown");
    m = +m; n = +n;
    if (m === n) return t("slot.match", carrierLabel(c), m, n);
    if (m * 2 < n) return t("slot.none", carrierLabel(c), m, n);
    return t("slot.near", carrierLabel(c), m, n);
  }

  function mcfgText(v) {
    if (v === "lock") return t("mcfg.lock");
    if (v === "unlock") return t("mcfg.unlockAuto");
    if (v === "none") return t("mcfg.noFile");
    if (v && v.startsWith("other:")) return t("mcfg.other", v.slice(6));
    return "-";
  }

  let checking = false;

  function renderCheck(info) {
    const set = (id, text) => { document.getElementById(id).textContent = text; };
    const ims = (v) => (v === "true" ? t("ims.yes") : v === "false" ? t("ims.no") : t("v.unknown"));
    set("st-ims1", ims(info.IMS1));
    set("st-ims2", ims(info.IMS2));
    if (info.CHECK_RESULT !== "OK") {
      for (const id of ["st-slot1", "st-slot2", "st-applied", "st-ua", "st-mcfg"]) set(id, t("v.notchecked"));
      document.getElementById("check-diff").hidden = true;
      if (!checking) set("check-hint", t("check.hint"));
      return;
    }
    set("st-slot1", slotText(info.SLOT1_CARRIER, info.SLOT1_MATCH, info.SLOT1_TOTAL));
    set("st-slot2", slotText(info.SLOT2_CARRIER, info.SLOT2_MATCH, info.SLOT2_TOTAL));
    const total = +(info.APPLIED_TOTAL || 0), match = +(info.APPLIED_MATCH || 0);
    let applied;
    if (!total) applied = t("applied.none");
    else if (match === total) applied = t("applied.kept");
    else if (!info.MARKER) applied = t("applied.gone");
    else applied = t("applied.partial", match, total);
    set("st-applied", applied);
    const build = info.BUILD || "";
    const uaState = (ua) => {
      if (!ua) return t("v.none");
      return t(build && ua.includes("/" + build + " ") ? "ua.current" : "ua.other");
    };
    set("st-ua", "SIM1 " + uaState(info.UA_EFS1) + " · SIM2 " + uaState(info.UA_EFS2));
    set("st-mcfg", "SIM1 " + mcfgText(info.MCFG_EFS1) + " · SIM2 " + mcfgText(info.MCFG_EFS2));
    let hint = t("check.at", info.CHECK_AT || "-");
    if (+(info.CHECK_ERRORS || 0) > 0) hint += " · " + t("check.unread", info.CHECK_ERRORS);
    if (!checking) set("check-hint", hint);
    // Long EFS paths stay folded until the summary is tapped.
    const paths = (info.APPLIED_DIFF || "").trim().split(/\s+/).filter(Boolean);
    const diff = document.getElementById("check-diff");
    diff.hidden = paths.length === 0;
    if (paths.length) {
      const count = total - match;
      diff.querySelector("summary").textContent = t("check.diff", count)
        + (count > paths.length ? " " + t("check.diffMax", paths.length) : "");
      document.getElementById("check-diff-list").textContent = paths.join("\n");
    }
  }

  document.getElementById("check").onclick = async (e) => {
    if (state.busy) { toast(t("t.otherBusy")); return; }
    e.target.disabled = true;
    checking = true;
    document.getElementById("check-hint").textContent = t("check.reading");
    const r = await exec(CTL + " check", 60000);
    checking = false;
    e.target.disabled = false;
    const res = parseKv(r.stdout).CHECK_RESULT;
    if (res === "BUSY") toast(t("t.otherBusy"));
    else if (res !== "OK") toast(t(r.errno === -2 ? "t.checkNoResult" : "t.noDiag"));
    await loadInfo();
  };

  document.getElementById("export").onclick = async (e) => {
    if (!confirm(t("confirm.export"))) return;
    e.target.disabled = true;
    const r = await exec(CTL + " export", 60000);
    e.target.disabled = false;
    const m = r.stdout.match(/EXPORTED=(\d+) (\S+)/);
    toast(m ? t("t.exported", m[1], m[2]) : (r.stdout.trim() || t("t.exportFail")));
    loadInfo();
  };

  function renderAuto(info) {
    let autoText;
    if (info.AUTO_ARMED !== "1") autoText = t("auto.noBase");
    else if (info.AUTO_GAVEUP === "1") autoText = t("auto.gaveup");
    else autoText = t("auto.base", info.AUTO_ARMED_AT || "-");
    if (info.AUTO_LAST) {
      autoText += " · " + t("auto.last", info.AUTO_LAST.replace(/ (sim_ok|sim_fail|ok|fail)$/, (m, k) => " " + t("auto.k." + k)));
    }
    document.getElementById("auto-status").textContent = autoText;
  }

  let initDone = false;
  async function init() {
    if (initDone) return;
    const loading = document.getElementById("loading");
    const loadfail = document.getElementById("loadfail");
    loadfail.hidden = true;
    loading.hidden = false;
    let info = null;
    try { info = await loadInfo(); } catch (e) { info = null; }
    loading.hidden = true;
    if (!info) { loadfail.hidden = false; return; }
    initDone = true;
    applyInfo(info);
  }

  function applyInfo(info) {
    state.defaultName = info.DEFAULT_NAME || "";
    state.build = info.BUILD || "";
    if (info.SIM1) state.sim1 = info.SIM1;
    if (info.SIM2) state.sim2 = info.SIM2;
    if (info.MCFG1) state.mcfg1 = info.MCFG1;
    if (info.MCFG2) state.mcfg2 = info.MCFG2;
    const nameEl = document.getElementById("name");
    nameEl.placeholder = state.defaultName;
    nameEl.value = info.NAME || "";
    if (info.UA) document.getElementById("opt-ua").checked = info.UA === "1";
    if (info.NV) document.getElementById("opt-nv").checked = info.NV === "1";
    if (info.VOLTE) document.getElementById("opt-volte").checked = info.VOLTE === "1";
    if (info.AUTO) document.getElementById("opt-auto").checked = info.AUTO === "1";
    if (info.AUTOSIM) document.getElementById("opt-autosim").checked = info.AUTOSIM === "1";
    if (info.GBAND) document.getElementById("opt-gband").checked = info.GBAND === "1" && info.GBAND_AVAILABLE !== "0";
    // The boot hook stores the full notice text; show it once, then clear it.
    if (info.AUTO_NOTICE) {
      toast(info.AUTO_NOTICE);
      exec(CTL + " ack");
    }
    renderSeg();
    renderMcfg();
    renderUa();
    if (info.BUSY === "1") startPolling(); else poll();
  }

  // Language picker: redraw every text in place (unsaved choices stay).
  function renderLang() {
    const sel = document.getElementById("lang");
    sel.innerHTML = "";
    I18N_LANGS.forEach((code, i) => {
      const o = document.createElement("option");
      o.value = code;
      o.textContent = I18N["lang.name"][i];
      o.selected = code === LANG;
      sel.appendChild(o);
    });
  }
  document.getElementById("lang").onchange = (e) => {
    i18nSet(e.target.value);
    i18nApply();
    renderSeg();
    renderMcfg();
    renderChannel();
    if (lastInfo) renderInfo(lastInfo);
    if (!remoteTag) document.getElementById("pack-remote").textContent = t("v.notchecked");
    showResult(lastLog);
  };

  // Draw the controls first so the page is never blank, then fill them in.
  i18nApply();
  renderLang();
  document.getElementById("check-hint").textContent = t("check.hint");
  document.getElementById("export-hint").textContent = t("export.hint");
  document.getElementById("pack-remote").textContent = t("v.notchecked");
  if (typeof ksu === "undefined") document.getElementById("noksu").hidden = false;
  renderSeg();
  renderMcfg();
  renderUa();
  renderChannel();
  document.getElementById("reload").onclick = init;
  if (typeof ksu !== "undefined") init();
</script>
</body>
</html>
